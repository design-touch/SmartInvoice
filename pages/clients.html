<!DOCTYPE html>
<html lang="en">
<head>

    <title>Clients — SmartInvoice</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="app">
        
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            Smart<span>Invoice</span>
        </div>

        <div class="nav-title">Workspace</div>

        <nav class="nav">
            <button data-page="dashboard" onclick="location.href='dashboard.html'">🏠 &nbsp; Dashboard</button>
            <button data-page="clients" onclick="location.href='clients.html'">👥 &nbsp; Clients</button>
            <button data-page="invoices" onclick="location.href='invoices.html'">🧾 &nbsp; Invoices</button>
            <button data-page="payments" onclick="location.href='payments.html'">💳 &nbsp; Payments</button>
            <button data-page="expenses" onclick="location.href='expenses.html'">💸 &nbsp; Expenses</button>
            <button data-page="income" onclick="location.href='income.html'">📈 &nbsp; Income</button>
            <button data-page="reports" onclick="location.href='reports.html'">📊 &nbsp; Reports</button>
            <button data-page="settings" onclick="location.href='settings.html'">⚙️ &nbsp; Settings</button>
        </nav>

        <div class="nav-title">Account</div>

        <nav class="nav">
            <button onclick="SmartInvoice.logout()">↪ &nbsp; Logout</button>
        </nav>
    </aside>
    

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button
                        class="mobile-menu"
                        onclick="SmartInvoice.toggleSidebar()"
                    >
                        ☰
                    </button>

                    <input
                        class="search"
                        type="search"
                        placeholder="Search clients, invoices, expenses..."
                    >
                </div>

                <div class="profile">
                    <span class="muted">Zahirul Islam</span>

                    <div class="avatar">
                        ZI
                    </div>
                </div>
            </header>

            <div class="content">
                
<div class="titlebar">
    <div>
        <h1>Clients</h1>
        <div class="muted">Manage your customers and companies</div>
    </div>

    <button class="btn btn-primary" onclick="SmartInvoice.toast('Add Client selected')">
        + Add Client
    </button>
</div>

<div class="toolbar">
    <input type="search" placeholder="Search clients...">

    <select>
        <option>All Clients</option>
        <option>Active</option>
        <option>Inactive</option>
    </select>
</div>

<div class="card table-card">
    <table>
        <thead>
            <tr>
                <th>Client</th>
                <th>Company</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Total Invoiced</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td><b>Rahim Ahmed</b></td>
                <td>Rahim Traders</td>
                <td>rahim@example.com</td>
                <td>01711-000000</td>
                <td>৳52,000</td>
                <td><button class="btn btn-outline" onclick="SmartInvoice.toast('Client opened')">View</button></td>
            </tr>

            <tr>
                <td><b>Nusrat Jahan</b></td>
                <td>ABC Solutions</td>
                <td>nusrat@example.com</td>
                <td>01822-000000</td>
                <td>৳32,500</td>
                <td><button class="btn btn-outline" onclick="SmartInvoice.toast('Client opened')">View</button></td>
            </tr>
        </tbody>
    </table>
</div>

            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
