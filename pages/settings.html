<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — SmartInvoice</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="app">
        
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            Smart<span>Invoice</span>
        </div>

        <div class="nav-title">Workspace</div>

        <nav class="nav">
            <button data-page="dashboard" onclick="location.href='dashboard.html'">🏠 &nbsp; Dashboard</button>
            <button data-page="clients" onclick="location.href='clients.html'">👥 &nbsp; Clients</button>
            <button data-page="invoices" onclick="location.href='invoices.html'">🧾 &nbsp; Invoices</button>
            <button data-page="payments" onclick="location.href='payments.html'">💳 &nbsp; Payments</button>
            <button data-page="expenses" onclick="location.href='expenses.html'">💸 &nbsp; Expenses</button>
            <button data-page="income" onclick="location.href='income.html'">📈 &nbsp; Income</button>
            <button data-page="reports" onclick="location.href='reports.html'">📊 &nbsp; Reports</button>
            <button data-page="settings" onclick="location.href='settings.html'">⚙️ &nbsp; Settings</button>
        </nav>

        <div class="nav-title">Account</div>

        <nav class="nav">
            <button onclick="SmartInvoice.logout()">↪ &nbsp; Logout</button>
        </nav>
    </aside>
    

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button
                        class="mobile-menu"
                        onclick="SmartInvoice.toggleSidebar()"
                    >
                        ☰
                    </button>

                    <input
                        class="search"
                        type="search"
                        placeholder="Search clients, invoices, expenses..."
                    >
                </div>

                <div class="profile">
                    <span class="muted">Zahirul Islam</span>

                    <div class="avatar">
                        ZI
                    </div>
                </div>
            </header>

            <div class="content">
                
<div class="titlebar">
    <div>
        <h1>Settings</h1>
        <div class="muted">Configure your business and invoice preferences</div>
    </div>
</div>

<div class="card">
    <h3>Business Information</h3>

    <div class="form-grid">
        <div class="field">
            <label>Business Name</label>
            <input value="Zahirul Islam Services">
        </div>

        <div class="field">
            <label>Email</label>
            <input value="zahirulislamtaj@gmail.com">
        </div>

        <div class="field">
            <label>Phone</label>
            <input placeholder="01XXXXXXXXX">
        </div>

        <div class="field">
            <label>Website</label>
            <input placeholder="https://">
        </div>

        <div class="field full">
            <label>Business Address</label>
            <textarea rows="3"></textarea>
        </div>

        <div class="field">
            <label>Currency</label>
            <select>
                <option>BDT - ৳</option>
                <option>USD - $</option>
            </select>
        </div>

        <div class="field">
            <label>Invoice Prefix</label>
            <input value="INV-">
        </div>
    </div>

    <button class="btn btn-primary" onclick="SmartInvoice.toast('Settings saved')">
        Save Changes
    </button>
</div>

            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
